<form method="POST" class="bg-black p-8 rounded-2xl shadow-lg w-full max-w-md mx-auto border border-gray-700">
    {% csrf_token %}
    <h2 class="text-3xl font-bold text-white mb-6 text-center">Login</h2>
    
    <div class="mb-6">
        <label for="username" class="block text-gray-400 mb-2">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username"
            class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    
    <div class="mb-6">
        <label for="password" class="block text-gray-400 mb-2">Password</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password"
            class="w-full p-3 rounded-lg bg-gray-800 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    
    <button type="submit"
        class="w-full bg-green-500 hover:bg-green-600 text-black font-semibold py-3 px-4 rounded-lg transition-all duration-300 ease-in-out">
        Login
    </button>
    
    <p class="mt-6 text-gray-400 text-center">
        Belum punya akun? <a href="{% url 'register' %}" class="text-green-500 hover:underline">Daftar di sini</a>.
    </p>
</form>
