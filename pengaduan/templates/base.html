{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pengaduan Masyarakat{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 p-4 text-white">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Laporin</h1>
            <div class="flex-1 text-center">
                <a href="{% url 'home' %}" class="mx-4 hover:underline">Beranda</a>
                <a href="" class="mx-4 hover:underline">Tentang</a>
                <a href="" class="mx-4 hover:underline">Pengaduan</a>
                <a href="" class="mx-4 hover:underline">Contact</a>
            </div>
            <div class="flex items-center gap-4">
                {% if user.is_authenticated %}
                    <a href="" class="hover:underline">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A9 9 0 1118.882 5.12M15 7h.01M19.07 15.07a9.014 9.014 0 01-1.414 1.414M4.93 8.93a9.014 9.014 0 011.414-1.414" />
                        </svg>
                    </a>
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="hover:underline">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'register' %}" class="hover:underline">Register</a>
                    <a href="{% url 'login' %}" class="hover:underline">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container mx-auto mt-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
